<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirVision - Inspection Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script async src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --font-sans: "Prompt", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --ink: #000;
      --paper: #fff;
      --muted: #737373;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--ink);
      background: #fff;
      background-image: radial-gradient(circle at 2px 2px, rgba(0, 0, 0, .055) 1px, transparent 0);
      background-size: 24px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.25rem;
    }

    button, input, select { font: inherit; }
    button:disabled { cursor: not-allowed; opacity: .48; }

    .app {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: .5rem 0 2rem;
    }

    .poster-card {
      width: 100%;
      max-width: 900px;
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 12px 12px 0 var(--ink);
      position: relative;
      overflow: visible;
    }

    .poster-header {
      background: #000;
      color: #fff;
      border-bottom: 2px solid #000;
      position: relative;
      overflow: hidden;
    }

    .poster-header:after {
      content: "";
      position: absolute;
      top: 0;
      right: 18px;
      width: 96px;
      height: 100%;
      opacity: .45;
      background: repeating-linear-gradient(90deg, #fff, #fff 1px, transparent 1px, transparent 7px);
    }

    .poster-header > * { position: relative; z-index: 1; }
    .poster-header h1 {
      font-size: clamp(2.45rem, 9vw, 3.75rem);
      line-height: .92;
      overflow-wrap: anywhere;
    }

    .grid-paper {
      background-color: #fff;
      background-image:
        linear-gradient(rgba(0, 0, 0, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, .055) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .badge-label {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      background: #000;
      color: #fff;
      padding: 4px 12px;
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 800;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      color: #555;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }

    .sticker-badge {
      background: #d1d5db;
      color: #000;
      border: 1.5px solid #000;
      box-shadow: 2px 2px 0 #000;
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pill-input {
      width: 100%;
      min-height: 48px;
      background: #f8f8fa;
      border: 1.5px solid #000;
      border-radius: 0;
      color: #000;
      padding: 12px 14px;
      font-weight: 800;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .pill-input:focus {
      outline: none;
      background: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, .18);
    }

    .pill-input:disabled {
      background: #eee;
      color: #999;
    }

    .upload-card {
      min-height: 290px;
      aspect-ratio: 1 / 1;
      background: #fdfdfd;
      border: 2px dashed #cfcfcf;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .upload-card:hover {
      border-color: #000;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    .upload-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .primary-button,
    .secondary-button {
      border: 2px solid #000;
      min-height: 54px;
      padding: 13px 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .02em;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .primary-button {
      background: #000;
      color: #fff;
    }

    .secondary-button {
      background: #fff;
      color: #000;
    }

    .primary-button:not(:disabled):hover,
    .secondary-button:not(:disabled):hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 #000;
    }

    .primary-button:not(:disabled):hover { background: #222; }
    .secondary-button:not(:disabled):hover { background: #f3f3f3; }

    .score-circle {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: #000;
      color: #fff;
      border: 2px solid #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .barcode-sim {
      height: 42px;
      width: 116px;
      background: repeating-linear-gradient(90deg, #000, #000 1px, transparent 1px, transparent 3px, #000 3px, #000 5px, transparent 5px, transparent 8px);
      opacity: .35;
      flex: 0 0 auto;
    }

    .signature-area {
      background: #fff;
      border: 2px solid #000;
      position: relative;
      overflow: hidden;
    }

    .cpu-mark {
      width: 76px;
      height: 76px;
      color: #a8adb6;
      animation: breathe 1.4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); opacity: .65; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @media (max-width: 760px) {
      body { padding: .75rem; }
      .poster-card { box-shadow: 7px 7px 0 #000; }
      .poster-header:after { width: 64px; right: 8px; }
      .upload-card { min-height: 220px; }
      .barcode-sim { width: 80px; }
      .primary-button,
      .secondary-button { width: 100%; }
      .sticker-badge {
        max-width: calc(100vw - 72px);
        white-space: normal;
        line-height: 1.25;
      }
    }

    @media (min-width: 761px) and (max-width: 1024px) {
      body { padding: 1rem; }
      .poster-card { max-width: 860px; }
      .upload-card { min-height: 260px; }
    }
  </style>
</head>
<body>
  <div id="root" class="app">
    <div style="width:100%;max-width:720px;background:#fff;border:2px solid #000;box-shadow:8px 8px 0 #000;padding:32px;font-family:'Prompt',sans-serif;">
      <div style="display:inline-block;background:#000;color:#fff;padding:4px 10px;font-family:monospace;font-size:10px;font-weight:800;">AIRVISION LOADING</div>
      <h1 style="margin:18px 0 6px;font-size:34px;font-weight:900;font-style:italic;">AIRVISION™</h1>
      <p style="margin:0;color:#555;font-size:13px;">กำลังโหลดหน้าระบบตรวจวิเคราะห์...</p>
    </div>
  </div>
  <script>
    window.onerror = function(message, source, line, column, error) {
      var rootEl = document.getElementById('root');
      if (rootEl) {
        rootEl.innerHTML =
          '<div style="width:100%;max-width:760px;background:#fff;border:2px solid #000;box-shadow:8px 8px 0 #000;padding:28px;font-family:Prompt,sans-serif;color:#000;">' +
          '<div style="display:inline-block;background:#000;color:#fff;padding:4px 10px;font-family:monospace;font-size:10px;font-weight:800;">SCRIPT ERROR</div>' +
          '<h2 style="margin:16px 0 8px;font-size:22px;font-weight:900;">หน้าเว็บโหลดไม่สำเร็จ</h2>' +
          '<p style="font-size:13px;line-height:1.6;">' + String(message) + '</p>' +
          '<p style="font-size:11px;color:#666;">Line: ' + line + ' Column: ' + column + '</p>' +
          '</div>';
      }
      return false;
    };

    let modelPromise = null;
    let beforeImage = '';
    let afterImage = '';
    let beforeResult = null;
    let afterResult = null;
    let signature = '';
    let sigPad = null;
    let currentStatus = 'กำลังโหลดโมเดล...';
    let isSaving = false;
    let inspectionInfo = null;

    const root = document.getElementById('root');
    const $ = (id) => document.getElementById(id);
    const scriptPromises = {};

    function ensureScript(src) {
      if (scriptPromises[src]) return scriptPromises[src];
      scriptPromises[src] = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;
        script.onload = resolve;
        script.onerror = () => reject(new Error('โหลดไลบรารีไม่สำเร็จ: ' + src));
        document.head.appendChild(script);
      });
      return scriptPromises[src];
    }

    async function loadModelLibraries() {
      await ensureScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js');
      await ensureScript('https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js');
    }

    const CAR_DATA = {
      Toyota: ['Yaris', 'Yaris Ativ', 'Vios', 'Corolla Altis', 'Camry', 'Fortuner', 'Hilux Revo'],
      Honda: ['City', 'Civic', 'Accord', 'HR-V', 'CR-V'],
      Isuzu: ['D-Max', 'MU-X'],
      Mitsubishi: ['Xpander', 'Pajero Sport', 'Triton'],
      Nissan: ['Almera', 'Navara', 'Kicks'],
      Mazda: ['Mazda 2', 'Mazda 3', 'CX-3', 'CX-5'],
      Ford: ['Ranger', 'Everest'],
      MG: ['MG 3', 'MG 4 Electric', 'MG ZS', 'MG HS'],
      BYD: ['Atto 3', 'Dolphin', 'Seal'],
      'อื่นๆ (Other)': ['ระบุเอง']
    };

    const reasons = {
      1: 'พบการอุดตันและคราบสะสมในระดับรุนแรง ควรทำความสะอาดทันที',
      2: 'พบคราบสกปรกหนาแน่นและช่องครีบถูกบดบังหลายจุด',
      3: 'พบการสะสมของฝุ่นและคราบบนผิวคอยล์ในระดับสูง',
      4: 'คอยล์มีคราบและฝุ่นบางส่วน แต่ยังเห็นโครงสร้างครีบได้ชัดเจน',
      5: 'คอยล์ได้รับการฟื้นฟูเบื้องต้น ช่องครีบส่วนใหญ่เริ่มเปิดออก',
      6: 'แผงคอยล์สะอาดในระดับดี ร่องครีบคมชัดและเปิดโล่ง',
      7: 'แผงคอยล์สะอาดทั่วบริเวณ อากาศไหลผ่านได้อย่างมีประสิทธิภาพ',
      8: 'แผงคอยล์สะอาดระดับสูง พื้นผิวโลหะเริ่มมีความเงางาม',
      9: 'แผงคอยล์สะอาดดีเยี่ยม ซี่ฟินคมชัดและพื้นผิวสม่ำเสมอ',
      10: 'แผงคอยล์สะอาดหมดจดระดับสูงสุด ร่องครีบเปิดโล่งเหมือนใหม่'
    };

    function setRoot(html) {
      root.innerHTML = html;
    }

    function timeout(promise, ms, message) {
      let timer;
      const limit = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(message)), ms);
      });
      return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
    }

    async function loadModel() {
      if (!modelPromise) {
        modelPromise = (async () => {
          await loadModelLibraries();
          if (!window.tmImage) {
            throw new Error('ไม่พบไลบรารี Teachable Machine');
          }
          return tmImage.load('/my_model/model.json', '/my_model/metadata.json');
        })();
      }
      return timeout(modelPromise, 45000, 'โหลดโมเดลนานเกินไป');
    }

    function imageFromDataUrl(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('อ่านรูปไม่ได้'));
        img.src = src;
      });
    }

    function levelOf(className, index) {
      const text = String(className || '');
      const match = text.match(/level\s*(10|[1-9])/i) || text.match(/\b(10|[1-9])\b/);
      return match ? Number(match[1]) : Math.min(Math.max(index + 1, 1), 10);
    }

    async function analyzeImage(src) {
      const model = await loadModel();
      const img = await imageFromDataUrl(src);
      const predictions = await timeout(model.predict(img), 20000, 'ประเมินรูปนานเกินไป');
      const ranked = predictions
        .map((item, index) => ({
          className: item.className,
          probability: Number(item.probability || 0),
          score: levelOf(item.className, index)
        }))
        .sort((a, b) => b.probability - a.probability);
      const top = ranked[0];
      return {
        ...top,
        label_th: 'Level ' + top.score,
        label_en: top.className,
        reason: reasons[top.score] || 'วิเคราะห์จาก Teachable Machine',
        predictions: ranked
      };
    }

    function currentInfo() {
      if (!$('customerName') && inspectionInfo) {
        return inspectionInfo;
      }
      return {
        customerName: $('customerName') ? $('customerName').value.trim() : '',
        phone: $('phone') ? $('phone').value.trim() : '',
        brand: $('brand') ? $('brand').value : '',
        model: $('modelCar') ? $('modelCar').value : '',
        plate: $('plate') ? $('plate').value.trim() : ''
      };
    }

    function safeText(value, fallback = '-') {
      return value ? String(value) : fallback;
    }

    function renderHeader() {
      return `
        <div class="poster-header px-8 md:px-9 py-7 md:py-9">
          <div class="flex justify-between items-start gap-4 mb-3">
            <div class="badge-label bg-black text-white">AirVision™ ระบบตรวจวิเคราะห์และฟื้นฟูคอยล์เย็นรถยนต์</div>
            <div class="text-xs font-mono font-black text-white tracking-widest uppercase">ขั้นตอนที่ 01 / 04</div>
          </div>
          <h1 class="text-5xl md:text-6xl font-black mb-2 tracking-tighter italic uppercase leading-none">AIRVISION™</h1>
          <p class="text-gray-400 text-xs font-medium tracking-wide uppercase">ศูนย์บริการมาตรฐานด้านการตรวจสภาพและทำความสะอาดระบบปรับอากาศรถยนต์</p>
        </div>
      `;
    }

    function renderStep1(error = '') {
      const brandOptions = Object.keys(CAR_DATA)
        .sort((a, b) => a === 'อื่นๆ (Other)' ? 1 : b === 'อื่นๆ (Other)' ? -1 : a.localeCompare(b))
        .map((brand) => `<option value="${brand}">${brand}</option>`)
        .join('');

      setRoot(`
        <div class="poster-card">
          ${renderHeader()}
          <div class="p-6 md:p-10 grid-paper">
            ${error ? `<div class="mb-8 p-4 bg-gray-50 border-2 border-black flex items-center gap-3 text-black text-xs font-black uppercase italic">△ ${error}</div>` : ''}

            <div class="mb-10 relative pt-4">
              <div class="sticker-badge absolute -top-3 right-4 rotate-3 z-10">ทะเบียนข้อมูลยานพาหนะ (Vehicle Registration)</div>
              <div class="bg-white p-4 md:p-6 border-2 border-black flex flex-col gap-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <div class="section-label text-[13px]">ชื่อลูกค้า (Customer Name)</div>
                    <input id="customerName" type="text" placeholder="กรอกชื่อ-นามสกุลผู้ใช้บริการ..." class="pill-input uppercase text-xs md:text-sm">
                  </div>
                  <div>
                    <div class="section-label text-[13px]">หมายเลขโทรศัพท์ (Phone Number)</div>
                    <input id="phone" type="text" placeholder="0XX-XXX-XXXX" class="pill-input text-xs md:text-sm">
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <div class="section-label text-[13px]">ยี่ห้อรถ (Vehicle Brand)</div>
                    <select id="brand" class="pill-input appearance-none bg-white text-xs md:text-sm px-2">
                      <option value="">SELECT...</option>
                      ${brandOptions}
                    </select>
                  </div>
                  <div>
                    <div class="section-label text-[13px]">รุ่นรถ (Vehicle Model)</div>
                    <select id="modelCar" class="pill-input appearance-none bg-white text-xs md:text-sm px-2" disabled>
                      <option value="">SELECT...</option>
                    </select>
                  </div>
                  <div>
                    <div class="section-label text-[13px]">หมายเลขทะเบียน</div>
                    <input id="plate" type="text" placeholder="PLATE..." class="pill-input text-xs md:text-sm px-2">
                  </div>
                </div>
              </div>
            </div>

            <div class="mb-10 border-2 border-black p-5 md:p-6 rounded-xl relative bg-white">
              <div class="flex items-center gap-3 mb-6 justify-center">
                <div class="h-0.5 w-8 bg-black"></div>
                <h2 class="text-md md:text-lg font-black uppercase tracking-tight text-center text-[#111]">บันทึกภาพตรวจสอบคอยล์เย็น (Evaporator Condition Capture)</h2>
                <div class="h-0.5 w-8 bg-black"></div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">
                <div class="relative">
                  <div class="absolute -top-2.5 left-4 bg-black text-white text-[9px] px-2 py-0.5 z-10 font-mono italic">ภาพก่อนเข้ารับบริการ</div>
                  <label class="upload-card border-black border-2 shadow-[4px_4px_0px_#000]">
                    <input id="beforeInput" type="file" accept="image/*" class="hidden">
                    <div id="beforeSlot" class="text-center p-6 text-[#111]">
                      <div class="mb-2 text-3xl">▣</div>
                      <p class="font-black text-xs uppercase tracking-tighter">อัปโหลดภาพก่อนทำความสะอาด</p>
                    </div>
                  </label>
                </div>

                <div class="relative">
                  <div class="absolute -top-2.5 left-4 bg-black text-white text-[9px] px-2 py-0.5 z-10 font-mono italic">ภาพหลังให้บริการ</div>
                  <label class="upload-card border-black border-2 shadow-[4px_4px_0px_#000]">
                    <input id="afterInput" type="file" accept="image/*" class="hidden">
                    <div id="afterSlot" class="text-center p-6 text-[#111]">
                      <div class="mb-2 text-3xl">▣</div>
                      <p class="font-black text-xs uppercase tracking-tighter">อัปโหลดภาพหลังทำความสะอาด</p>
                    </div>
                  </label>
                </div>
              </div>
            </div>

            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 border-t-2 border-black pt-6">
              <div class="barcode-sim h-12 w-28 opacity-40"></div>
              <button id="startBtn" class="primary-button max-w-md flex-1 shadow-[4px_4px_0px_#000]" disabled>เริ่มการวิเคราะห์สภาพคอยล์เย็น ◫</button>
            </div>
            <div id="modelStatus" class="mt-3 text-[10px] font-mono font-bold uppercase text-gray-500">SYSTEM LOADING...</div>
          </div>
        </div>
      `);

      attachStep1();
    }

    function attachStep1() {
      const status = $('modelStatus');
      status.textContent = 'MODEL READY WHEN ANALYSIS STARTS';
      checkReady();

      $('brand').onchange = (event) => {
        const brand = event.target.value;
        const modelSelect = $('modelCar');
        modelSelect.disabled = !brand;
        modelSelect.innerHTML = '<option value="">SELECT...</option>' + ((CAR_DATA[brand] || [])
          .map((model) => `<option value="${model}">${model}</option>`)
          .join('')) + (brand ? '<option value="อื่นๆ">ระบุรุ่นเอง...</option>' : '');
      };

      $('plate').oninput = checkReady;
      $('startBtn').onclick = startProcess;

      bindUpload('beforeInput', 'beforeSlot', (value) => { beforeImage = value; });
      bindUpload('afterInput', 'afterSlot', (value) => { afterImage = value; });

      function bindUpload(inputId, slotId, assign) {
        $(inputId).onchange = (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/')) {
            alert('กรุณาเลือกไฟล์รูปภาพเท่านั้น');
            event.target.value = '';
            return;
          }
          const reader = new FileReader();
          reader.onload = (readerEvent) => {
            assign(readerEvent.target.result);
            $(slotId).innerHTML = `<img src="${readerEvent.target.result}" referrerpolicy="no-referrer" alt="">`;
            checkReady();
          };
          reader.readAsDataURL(file);
        };
      }

      function checkReady() {
        $('startBtn').disabled = !(beforeImage && $('plate').value.trim());
      }
    }

    async function startProcess() {
      const car = currentInfo();
      if (!beforeImage || !car.plate) {
        renderStep1('กรุณากรอกทะเบียนและอัปโหลดรูปก่อนให้บริการ');
        return;
      }
      inspectionInfo = car;

      try {
        currentStatus = 'กำลังโหลดโมเดล...';
        renderStep2();
        await loadModel();

        currentStatus = 'กำลังวิเคราะห์ภาพก่อนให้บริการ...';
        renderStep2();
        beforeResult = await analyzeImage(beforeImage);

        currentStatus = 'กำลังวิเคราะห์ภาพหลังให้บริการ...';
        renderStep2();
        afterResult = afterImage
          ? await analyzeImage(afterImage)
          : {
              score: 10,
              className: 'Level 10',
              probability: 1,
              label_th: 'Level 10',
              label_en: 'Pristine',
              reason: 'คอยล์เย็นอยู่ในสภาพใหม่สมบูรณ์สูงสุด ไม่พบสิ่งสกปรกตกค้าง'
            };

        renderStep3();
      } catch (error) {
        renderStep1('เกิดข้อผิดพลาดในการประเมินด้วย Teachable Machine: ' + error.message);
      }
    }

    function renderStep2() {
      setRoot(`
        <div class="poster-card bg-white border-2 border-black shadow-[12px_12px_0px_#000] p-8 md:p-12 relative max-w-3xl min-h-[210px] flex flex-col items-center justify-center">
          <div class="absolute top-0 left-0 bg-black text-white px-4 py-1 text-[10px] font-mono font-bold uppercase tracking-wider">ระบบกำลังประมวลผลข้อมูล</div>
          <svg class="cpu-mark mb-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="8" width="8" height="8" rx="1"></rect>
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 15h3M1 9h3M1 15h3"></path>
          </svg>
          <div class="badge-label mb-5">ระบบกำลังประมวลผลข้อมูล</div>
          <div class="w-full">
            <h2 class="text-2xl md:text-3xl font-black text-black mb-4 tracking-tight text-left">ระบบ AI กำลังวิเคราะห์โครงสร้างพื้นผิวคอยล์เย็น</h2>
            <div class="font-mono text-xs text-black space-y-1 mt-2">
              <p class="font-medium">สถานะ: ${currentStatus}</p>
              <p class="font-bold tracking-wider">MODEL: TEACHABLE MACHINE</p>
            </div>
          </div>
        </div>
      `);
    }

    function renderStep3() {
      setRoot(`
        <div class="poster-card">
          <div class="poster-header bg-black py-4 px-6 flex justify-between items-center gap-4">
            <div class="font-black text-xl italic tracking-tighter text-white uppercase">ขั้นตอนที่ 03: วิเคราะห์สภาพระบบ</div>
            <div class="badge-label bg-gray-700 text-white">ANALYSIS</div>
          </div>

          <div class="p-6 md:p-10 grid-paper text-[#111]">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 mb-10">
              ${analysisCard(`Before_${safeText(inspectionInfo && inspectionInfo.plate, 'NoPlate')}`, 'ก่อนให้บริการ', `Before_${safeText(inspectionInfo && inspectionInfo.plate, 'NoPlate')}`, beforeImage, beforeResult, '')}
              ${analysisCard(`After_${safeText(inspectionInfo && inspectionInfo.plate, 'NoPlate')}`, 'หลังให้บริการ', `After_${safeText(inspectionInfo && inspectionInfo.plate, 'NoPlate')}`, afterImage || beforeImage, afterResult, afterResult.score >= 8 ? ' (ดีเยี่ยม)' : '')}
            </div>

            <div class="bg-white border-2 border-black p-6 mb-8 relative shadow-[6px_6px_0px_#000]">
              <div class="sticker-badge absolute -top-3 right-6 z-10 rotate-2">AUTHENTICATION</div>
              <div class="flex items-center gap-2 mb-4">
                <span class="text-lg">✒</span>
                <h3 class="font-black text-sm uppercase tracking-tight text-black">ลายเซ็นยืนยันการเข้ารับบริการ (Signature Verification)</h3>
              </div>
              <div class="signature-area h-44 bg-white relative">
                <canvas id="sig" class="w-full h-full cursor-crosshair touch-none"></canvas>
                <button id="clearSig" class="absolute top-2 right-2 text-[10px] font-mono font-bold underline uppercase text-gray-400 hover:text-black z-20">Reset Pad</button>
                <div class="absolute bottom-2 right-2 opacity-50">
                  <p class="text-[9px] italic font-bold text-gray-500">(ลูกค้ารับรองความถูกต้องของข้อมูล)</p>
                </div>
              </div>
            </div>

            <button id="confirmBtn" class="primary-button w-full shadow-[4px_4px_0px_#000] text-sm">สรุปรายงานผลและยืนยันบริการ ✓</button>
          </div>
        </div>
      `);
      initSignature();
    }

    function analysisCard(tag, title, diag, image, result, suffix) {
      return `
        <div class="relative bg-white border-2 border-black p-4 shadow-[6px_6px_0px_#000]">
          <div class="sticker-badge absolute -top-3 right-4 rotate-6 z-10">${tag}</div>
          <div class="section-label mb-2 flex justify-between uppercase font-bold text-gray-400">
            <span>${title}</span>
            <span>${diag}</span>
          </div>
          <div class="aspect-square border-2 border-black overflow-hidden mb-4">
            <img src="${image}" class="w-full h-full object-cover" referrerpolicy="no-referrer" alt="">
          </div>
          <div class="flex items-center gap-3 mb-4">
            <div class="score-circle">${result.score}</div>
            <div class="flex-1 min-w-0">
              <div class="font-black text-base uppercase leading-none text-black">ระดับคุณภาพ: LEVEL ${result.score}${suffix}</div>
              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mt-1">${tag.indexOf('Before_') === 0 ? 'Verification Output' : 'Final Efficiency Data'}</div>
            </div>
          </div>
          <div class="bg-gray-100 p-3 font-sans text-xs leading-relaxed border-l-4 border-black text-gray-700 min-h-[70px]">${result.reason}</div>
        </div>
      `;
    }

    async function initSignature() {
      try {
        await ensureScript('https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js');
        const canvas = $('sig');
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext('2d').scale(ratio, ratio);
        sigPad = new SignaturePad(canvas, {
          backgroundColor: 'rgba(255,255,255,0)',
          penColor: '#111',
          velocityFilterWeight: .7
        });
        $('clearSig').onclick = () => sigPad.clear();
        $('confirmBtn').onclick = () => {
          if (sigPad.isEmpty()) {
            alert('กรุณาเซ็นชื่อก่อนยืนยัน');
            return;
          }
          signature = sigPad.toDataURL('image/png');
          renderStep4();
        };
      } catch (error) {
        alert('โหลดระบบลายเซ็นไม่สำเร็จ: ' + error.message);
      }
    }

    function renderStep4() {
      const car = currentInfo();
      const cert = Math.random().toString(36).substring(2, 10).toUpperCase();

      setRoot(`
        <div class="w-full">
          <div id="report" class="poster-card mx-auto">
            <div class="poster-header bg-black flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 py-6 px-8">
              <div>
                <h1 class="text-4xl font-black italic tracking-tighter text-white uppercase">INSPECTION</h1>
                <p class="font-mono text-[9px] text-gray-400 tracking-[0.25em] uppercase">Diagnostic Clearance Report</p>
              </div>
              <div class="bg-white p-2 px-4 rotate-3 border-2 border-black text-black font-black text-md shadow-[4px_4px_0px_#000]">${safeText(car.plate, '-')}</div>
            </div>

            <div class="p-8 md:p-10 grid-paper">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 md:gap-8 mb-10">
                <div>
                  <div class="text-[11px] font-bold text-gray-500 mb-1">ก่อนให้บริการ</div>
                  <div class="text-xs font-black text-black mb-2">ระดับคุณภาพ: LEVEL ${beforeResult.score}</div>
                  <div class="aspect-[4/3] border-2 border-black shadow-[4px_4px_0px_#000] overflow-hidden grayscale">
                    <img src="${beforeImage}" class="w-full h-full object-cover" referrerpolicy="no-referrer" alt="">
                  </div>
                </div>
                <div>
                  <div class="text-[11px] font-bold text-gray-500 mb-1">หลังให้บริการ</div>
                  <div class="text-xs font-black text-black mb-2">ระดับคุณภาพ: LEVEL ${afterResult.score}${afterResult.score >= 8 ? ' (ดีเยี่ยม)' : ''}</div>
                  <div class="aspect-[4/3] border-2 border-black shadow-[4px_4px_0px_#000] overflow-hidden">
                    <img src="${afterImage || beforeImage}" class="w-full h-full object-cover" referrerpolicy="no-referrer" alt="">
                  </div>
                </div>
              </div>

              <div class="mb-10">
                <div class="bg-white border-2 border-black p-6 relative shadow-[6px_6px_0px_#000]">
                  <div class="sticker-badge absolute -top-3 left-6 right-auto -rotate-3 z-10">CERTIFIED</div>
                  <div class="flex flex-col gap-6 pt-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-xs font-mono">
                      <div>
                        <div class="text-gray-400 text-[9px] uppercase">Customer:</div>
                        <div class="font-bold text-black truncate">${safeText(car.customerName)}</div>
                      </div>
                      <div>
                        <div class="text-gray-400 text-[9px] uppercase">Plate:</div>
                        <div class="font-bold text-black truncate">${safeText(car.plate)}</div>
                      </div>
                      <div>
                        <div class="text-gray-400 text-[9px] uppercase">Model:</div>
                        <div class="font-bold text-black italic uppercase truncate">${safeText(car.brand, '')} ${safeText(car.model, '')}</div>
                      </div>
                      <div>
                        <div class="text-gray-400 text-[9px] uppercase">Status:</div>
                        <div class="font-black text-black tracking-wide italic">CLEARED</div>
                      </div>
                    </div>

                    <div class="border-t-2 border-dashed border-black w-full"></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <div class="text-gray-400 font-mono text-[9px] uppercase">ก่อนให้บริการ</div>
                        <div class="text-3xl font-black italic text-black tracking-tight my-1">LEVEL ${beforeResult.score}</div>
                        <p class="text-[10px] leading-relaxed text-gray-500">${beforeResult.reason}</p>
                      </div>
                      <div>
                        <div class="text-gray-400 font-mono text-[9px] uppercase">หลังให้บริการ</div>
                        <div class="text-3xl font-black italic text-black tracking-tight my-1">LEVEL ${afterResult.score}</div>
                        <p class="text-[10px] leading-relaxed text-black font-medium">${afterResult.reason}</p>
                      </div>
                    </div>
                    <div class="barcode-sim mt-2 w-full h-5 opacity-20"></div>
                  </div>
                </div>
              </div>

              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-6 pt-6 border-t-2 border-black">
                <div class="text-left font-mono">
                  <div class="text-[10px] uppercase text-gray-400">วันที่ออกเอกสาร</div>
                  <div class="font-black text-md text-black">${new Date().toLocaleDateString('th-TH')}</div>
                  <div class="text-[9px] text-gray-400 mt-0.5">Certificate No.: ${cert}</div>
                </div>
                <div class="text-center min-w-[160px]">
                  <div class="text-[9px] uppercase font-bold text-gray-400 mb-1">ลายเซ็นยืนยันการเข้ารับบริการ</div>
                  <div class="h-12 flex items-center justify-center">
                    <img src="${signature}" class="h-full object-contain filter contrast-125" referrerpolicy="no-referrer" alt="">
                  </div>
                  <div class="w-full h-0.5 bg-black my-1"></div>
                  <div class="text-[8px] text-gray-400 italic">(ลูกค้ารับรองความถูกต้องของข้อมูล)</div>
                </div>
              </div>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 mt-8 max-w-2xl mx-auto pb-8">
            <button id="pdfBtn" class="primary-button flex-1 bg-black text-white py-3 font-bold text-xs shadow-[4px_4px_0px_#000] uppercase">⇩ ดาวน์โหลดรายงาน (PDF)</button>
            <button onclick="location.reload()" class="secondary-button bg-white text-black py-3 px-4 font-bold text-xs border-2 border-black shadow-[4px_4px_0px_#000] flex items-center gap-1 shrink-0">+ สร้างรายการตรวจสอบใหม่</button>
          </div>
        </div>
      `);

      $('pdfBtn').onclick = saveAsPDF;
    }

    async function saveAsPDF() {
      if (isSaving) return;
      const btn = $('pdfBtn');
      const car = currentInfo();
      isSaving = true;
      btn.disabled = true;
      btn.textContent = 'กำลังสร้าง PDF...';

      try {
        await ensureScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
        await ensureScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
        const canvas = await html2canvas($('report'), {
          scale: 2,
          useCORS: true,
          backgroundColor: '#fff'
        });
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jspdf.jsPDF('p', 'mm', 'a4');
        const props = pdf.getImageProperties(imgData);
        const width = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const height = props.height * width / props.width;
        let heightLeft = height;
        let position = 0;

        pdf.addImage(imgData, 'PNG', 0, position, width, height);
        heightLeft -= pageHeight;
        while (heightLeft > 0) {
          position = heightLeft - height;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, width, height);
          heightLeft -= pageHeight;
        }

        const fileName = `AirVision_Report_${car.plate || 'NoPlate'}.pdf`;
        const pdfBase64 = pdf.output('datauristring');
        const response = await saveInspectionReport({
          customerName: car.customerName,
          phone: car.phone,
          vehicleBrand: car.brand,
          vehicleModel: car.model,
          plateNo: car.plate,
          beforeLevel: beforeResult.score,
          afterLevel: afterResult.score,
          beforeImage,
          afterImage: afterImage || beforeImage,
          pdfBase64
        });
        if (!response || !response.success) {
          throw new Error(response && response.error ? response.error : 'บันทึกข้อมูลไม่สำเร็จ');
        }
        pdf.save(fileName);
        alert('บันทึกสำเร็จ');
      } catch (error) {
        alert('บันทึกไม่สำเร็จ: ' + error.message);
      } finally {
        isSaving = false;
        btn.disabled = false;
        btn.textContent = '⇩ ดาวน์โหลดรายงาน (PDF)';
      }
    }

    function saveInspectionReport(payload) {
      if (window.google && google.script && google.script.run) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .saveInspectionReport(payload);
        });
      }
      return fetch('/api/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(async (response) => {
        const body = await response.json().catch(() => null);
        if (!response.ok) {
          throw new Error(body && body.error ? body.error : 'บันทึกข้อมูลไม่สำเร็จ');
        }
        return body;
      });
    }

    try {
      renderStep1();
    } catch (error) {
      window.onerror(error && error.message ? error.message : String(error), '', 0, 0, error);
    }
  </script>
</body>
