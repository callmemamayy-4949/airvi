<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WinkWink Teachable Machine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f5f7f1;
        color: #17201a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 12% 10%, rgba(98, 143, 125, 0.2), transparent 24rem),
          linear-gradient(135deg, #f8fbf4 0%, #eaf0e4 52%, #f7f2e8 100%);
      }

      main {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 420px);
        gap: clamp(20px, 4vw, 56px);
        align-items: center;
        padding: clamp(18px, 4vw, 56px);
      }

      .stage {
        display: grid;
        gap: 20px;
        align-content: center;
      }

      h1 {
        margin: 0;
        max-width: 760px;
        font-size: clamp(2.25rem, 7vw, 6.25rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .lede {
        margin: 0;
        max-width: 680px;
        color: #4a594f;
        font-size: clamp(1rem, 2.2vw, 1.35rem);
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #1f5e46;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 750;
        min-height: 48px;
        padding: 0 22px;
        transition:
          transform 160ms ease,
          background 160ms ease,
          box-shadow 160ms ease;
      }

      button:hover:not(:disabled) {
        background: #174a38;
        box-shadow: 0 12px 30px rgba(31, 94, 70, 0.2);
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .status {
        color: #526155;
        min-height: 24px;
      }

      .scanner {
        display: grid;
        gap: 18px;
        align-content: start;
        border: 1px solid rgba(31, 94, 70, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.68);
        padding: 18px;
        box-shadow: 0 24px 70px rgba(45, 54, 44, 0.14);
        backdrop-filter: blur(16px);
      }

      #webcam-container {
        display: grid;
        place-items: center;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 1;
        border-radius: 8px;
        background: #17201a;
      }

      #webcam-container canvas,
      #webcam-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .result {
        display: grid;
        gap: 8px;
      }

      .winner {
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid rgba(31, 94, 70, 0.16);
        padding-bottom: 12px;
        font-weight: 800;
      }

      .winner span:last-child {
        color: #1f5e46;
        white-space: nowrap;
      }

      #label-container {
        display: grid;
        gap: 8px;
      }

      .prediction {
        display: grid;
        gap: 5px;
      }

      .prediction-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: #35433a;
        font-size: 0.92rem;
      }

      .prediction-label {
        overflow-wrap: anywhere;
      }

      .bar {
        overflow: hidden;
        height: 8px;
        border-radius: 999px;
        background: rgba(31, 94, 70, 0.12);
      }

      .bar-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1f5e46, #77a37f);
        transition: width 120ms ease;
      }

      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          align-items: start;
        }

        h1 {
          font-size: clamp(2.1rem, 16vw, 4.8rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-labelledby="app-title">
        <h1 id="app-title">Evaporator Coil Classifier</h1>
        <p class="lede">
          เปิดกล้องเพื่อให้โมเดล Teachable Machine วิเคราะห์ระดับของ evaporator coil
          แบบเรียลไทม์
        </p>
        <div class="actions">
          <button id="start-button" type="button">เริ่มสแกน</button>
          <span id="status" class="status">พร้อมโหลดโมเดล</span>
        </div>
      </section>

      <section class="scanner" aria-label="Camera classifier">
        <div id="webcam-container" aria-live="polite"></div>
        <div class="result">
          <div class="winner">
            <span id="top-label">ยังไม่มีผลลัพธ์</span>
            <span id="top-score">0%</span>
          </div>
          <div id="label-container"></div>
        </div>
      </section>
    </main>

    <script>
      const URL = "https://teachablemachine.withgoogle.com/models/gjm22PuJo/";
      const IMAGE_SIZE = 224;

      const startButton = document.getElementById("start-button");
      const statusEl = document.getElementById("status");
      const webcamContainer = document.getElementById("webcam-container");
      const labelContainer = document.getElementById("label-container");
      const topLabel = document.getElementById("top-label");
      const topScore = document.getElementById("top-score");

      let model;
      let webcam;
      let maxPredictions = 0;
      let isRunning = false;
      const isIos = /iPhone|iPad/i.test(window.navigator.userAgent);

      startButton.addEventListener("click", init);

      async function init() {
        if (isRunning) return;

        startButton.disabled = true;
        statusEl.textContent = "กำลังโหลดโมเดล...";

        try {
          const modelURL = `${URL}model.json`;
          const metadataURL = `${URL}metadata.json`;

          model = await tmImage.load(modelURL, metadataURL);
          maxPredictions = model.getTotalClasses();
          renderPredictionSlots(model.getClassLabels());

          statusEl.textContent = "กำลังขอสิทธิ์ใช้กล้อง...";
          webcam = new tmImage.Webcam(IMAGE_SIZE, IMAGE_SIZE, true);
          await webcam.setup();

          webcamContainer.replaceChildren();
          if (isIos) {
            webcamContainer.appendChild(webcam.webcam);
            const video = webcam.webcam;
            video.setAttribute("playsinline", true);
            video.muted = true;
          } else {
            webcamContainer.appendChild(webcam.canvas);
          }

          await webcam.play();
          isRunning = true;
          statusEl.textContent = "กำลังสแกน";
          window.requestAnimationFrame(loop);
        } catch (error) {
          console.error(error);
          statusEl.textContent = "เปิดกล้องหรือโหลดโมเดลไม่สำเร็จ";
          startButton.disabled = false;
        }
      }

      async function loop() {
        if (!isRunning) return;
        webcam.update();
        await predict();
        window.requestAnimationFrame(loop);
      }

      async function predict() {
        const input = isIos ? webcam.webcam : webcam.canvas;
        const predictions = await model.predict(input);
        const sorted = [...predictions].sort((a, b) => b.probability - a.probability);
        const best = sorted[0];

        topLabel.textContent = best.className.trim();
        topScore.textContent = formatPercent(best.probability);

        predictions.forEach((prediction, index) => {
          const row = labelContainer.children[index];
          row.querySelector(".prediction-label").textContent = prediction.className.trim();
          row.querySelector(".prediction-score").textContent = formatPercent(prediction.probability);
          row.querySelector(".bar-fill").style.width = formatPercent(prediction.probability);
        });
      }

      function renderPredictionSlots(labels) {
        labelContainer.replaceChildren();
        labels.forEach((label) => {
          const item = document.createElement("div");
          item.className = "prediction";
          item.innerHTML = `
            <div class="prediction-row">
              <span class="prediction-label">${label.trim()}</span>
              <strong class="prediction-score">0%</strong>
            </div>
            <div class="bar" aria-hidden="true"><div class="bar-fill"></div></div>
          `;
          labelContainer.appendChild(item);
        });
      }

      function formatPercent(value) {
        return `${Math.round(value * 100)}%`;
      }
    </script>
  </body>
</html>
